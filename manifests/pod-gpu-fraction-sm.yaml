# Compute instance with a GPU fraction: memory AND compute capped to the fraction.
# Requires: Sysbox + the nvidia-sysbox RuntimeClass (node-setup/), upstream KAI
# scheduler (NvFractions), and the forked gpu-fractioning with smLimit.enforce and
# memoryGuard on (node-setup/gpu-fractioning-values.yaml).
#
# gpu-fraction alone sets both limits: 0.25 -> 10 GiB and 25% of SMs (~26 of 108).
# Optional: gpu-sm-percent lowers the SM share (never raises it).
apiVersion: v1
kind: Pod
metadata:
  name: ci-inst01
  namespace: ci-tenants
  labels:
    kai.scheduler/queue: tenants
  annotations:
    gpu-fraction: "0.25"
    # gpu-sm-percent: "20"
spec:
  automountServiceAccountToken: false   # tenants don't need API access
  schedulerName: kai-scheduler
  runtimeClassName: nvidia-sysbox
  hostUsers: false                      # required: also what stops tenants from mutating MPS
  containers:
    - name: main
      image: sysbox-ssh-kube-cpu-aware:24.04
      imagePullPolicy: IfNotPresent
      env:
        - name: INSTANCE_USER
          value: ubuntu
        - name: INSTANCE_PASSWORD
          value: "changeme123"
      ports:
        - {name: ssh, containerPort: 22}
      resources:
        limits:
          cpu: "2"
          memory: "8Gi"
